# Perfil prod: o conteiner (SPRING_PROFILES_ACTIVE=prod no Dockerfile).
spring.jpa.show-sql=false
# Sem padrao com localhost: so as origens informadas (o app publicado por padrao).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sima-sp.github.io}
# Modo de demonstracao desligado, a menos que seja pedido para a apresentacao.
ia.demonstracao-habilitada=${IA_DEMONSTRACAO:false}
# Atras de proxy (Render, Nginx): o IP do cliente vem do X-Forwarded-For, usado no limite de login (#19).
server.forward-headers-strategy=framework
# Fotos dos relatos num volume, para sobreviver a uma nova versao do conteiner (#15).
ocorrencia.pasta-fotos=${FOTOS_DIR:/dados/fotos}
