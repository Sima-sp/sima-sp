spring.application.name=simasp

# Perfis (#12): dev na maquina de quem desenvolve (padrao) e prod no conteiner (o Dockerfile liga).
spring.profiles.default=dev

spring.config.import=optional:file:./.env[.properties]

# DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
# show-sql liga so no perfil dev (application-dev.properties).
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# As datas vao para o banco no horario de Sao Paulo (#9). A URL do banco usa serverTimezone igual.
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Hospedagem para front-end
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://sima-sp.github.io}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=simasp
security.jwt.expiration-seconds=3600

# PRIMEIRO ADMINISTRADOR
# Criado ao subir, se ADMIN_EMAIL e ADMIN_SENHA estiverem definidos e o e-mail ainda nao existir.
admin.email=${ADMIN_EMAIL:}
admin.senha=${ADMIN_SENHA:}

# JACKSON
# Campo novo na resposta do servico de IA nao pode quebrar o backend.
spring.jackson.deserialization.fail-on-unknown-properties=false

# SERVICO DE IA (ml-service)
ia.habilitada=${IA_HABILITADA:true}
ia.url=${IA_URL:http://localhost:5000}
ia.timeout=2s
ia.validade=30m
ia.idade-maxima-leitura=30m
ia.cache-regioes=10m
ia.tamanho-lote=100
ia.falhas-para-abrir=3
ia.pausa-apos-falhas=1m
ia.intervalo=PT10M
ia.atraso-inicial=PT30S
# Modo de demonstracao (chuva simulada). Desligado por padrao: so ligar para apresentar.
ia.demonstracao-habilitada=${IA_DEMONSTRACAO:false}
ia.demonstracao-duracao=30m

# LEITURAS DO SENSOR (#10)
# Nivel medido (em % do bueiro cheio) a partir do qual a leitura vira MEDIO, ALTO e CRITICO.
# CRITICO = bueiro cheio: e a medicao "transbordando agora". Decisao do grupo; trocar aqui.
sensor.nivel.medio=50
sensor.nivel.alto=80
sensor.nivel.critico=100
# Depois de uma leitura, a previsao daquele sensor e recalculada no maximo uma vez neste intervalo.
sensor.intervalo-recalculo=PT1M

# ALERTAS (#13)
# O alerta nasce da leitura critica do sensor e se resolve sozinho quando chega uma leitura abaixo
# do critico e a ultima critica foi ha mais que isto. O admin pode resolver antes.
alerta.resolver-apos=PT5M

# Limite de logins errados (#19): por e-mail e por IP dentro da janela. Passou, 429 com Retry-After.
auth.tentativas.por-conta=5
auth.tentativas.por-ip=20
auth.tentativas.janela=PT15M

# Relatos do cidadao (#15). Fotos: JPEG/PNG ate 5 MB, gravadas sem metadados.
ocorrencia.pasta-fotos=${FOTOS_DIR:./dados/fotos}
ocorrencia.validade=${OCORRENCIA_VALIDADE:PT24H}
ocorrencia.limite-por-hora=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
