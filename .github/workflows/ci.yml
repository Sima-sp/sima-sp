# CI do repositório inteiro, em todo pull request e em todo envio para a main.
#
# Cada parte só roda se a pasta dela mudou (ou se este arquivo mudou). No fim, o job "ci" junta
# os resultados: é o único check que a regra da main exige, e ele passa quando nenhuma parte
# falhou (parte que não rodou conta como ok).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # roda tudo, pelo botão "Run workflow"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mudancas:
    name: O que mudou
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      ia: ${{ steps.filtro.outputs.ia == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      app: ${{ steps.filtro.outputs.app == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      site: ${{ steps.filtro.outputs.site == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      iot: ${{ steps.filtro.outputs.iot == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      infra: ${{ steps.filtro.outputs.infra == 'true' || steps.filtro.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - id: filtro
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend: ["backend/**"]
            ia: ["ia/**"]
            app: ["app/**"]
            site: ["site/**"]
            iot: ["iot/**"]
            # O Compose também quebra quando muda a configuração do backend ou um Dockerfile.
            infra:
              - "infra/**"
              - "backend/docs/sensores-capital.sql"
              - "backend/Dockerfile"
              - "backend/src/main/resources/application*.properties"
              - "ia/Dockerfile"
            ci: [".github/workflows/ci.yml"]

  backend:
    name: backend
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # MySQL de teste para o teste de contexto do Spring (Flyway + Hibernate validam o esquema).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: simasp_db
          MYSQL_USER: simasp_user
          MYSQL_PASSWORD: simasp_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/simasp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USERNAME: simasp_user
      DB_PASSWORD: simasp_password
      IA_HABILITADA: "false"
      IA_DEMONSTRACAO: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Chave JWT de teste (gerada na hora, nenhum segredo real)
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  backend-imagem:
    name: backend (imagem Docker)
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sima-backend backend

  ia:
    name: ia
    needs: mudancas
    if: needs.mudancas.outputs.ia == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ia/requirements-servico.lock
            ia/requirements-teste.txt
      - run: pip install -r requirements-servico.lock -r requirements-teste.txt
      - run: python -m pytest -q

  ia-imagem:
    name: ia (imagem Docker)
    needs: mudancas
    if: needs.mudancas.outputs.ia == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sima-ml-service ia

  app:
    name: app
    needs: mudancas
    if: needs.mudancas.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # Os dois builds: o da publicação (com o backend que vier da variável SIMA_API_URL; aqui, um
      # endereço de exemplo) e o que só tem a demonstração.
      - name: Build (o mesmo da publicação)
        run: npm run build
        env:
          VITE_API_URL: https://backend.exemplo
      - name: Build (só a demonstração)
        run: npm run build:demo

  site:
    name: site
    needs: mudancas
    if: needs.mudancas.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build (com a mesma subpasta da publicação)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sima-sp

  iot:
    name: iot
    needs: mudancas
    if: needs.mudancas.outputs.iot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Firmware compila para o ESP32
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - iot/firmware/sima_sensor
          enable-warnings-report: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iot/servidor-sensor/package-lock.json
      - name: Servidor do sensor instala e passa nos testes
        working-directory: iot/servidor-sensor
        run: |
          npm ci
          node --check server.js
          npm test

  infra:
    name: infra (Docker Compose)
    needs: mudancas
    if: needs.mudancas.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: .env de teste (gerado na hora, nenhum segredo real)
        run: ./gerar-env.sh admin@ci.simasp.local
      - name: Subir o sistema do zero
        run: docker compose up -d --build
      - name: Esperar o backend e a carga dos pontos
        run: |
          estado=""
          for i in $(seq 1 60); do
            estado=$(docker compose ps -a dados --format '{{.State}} {{.ExitCode}}')
            [ "$estado" = "exited 0" ] && break
            sleep 5
          done
          docker compose ps -a
          if [ "$estado" != "exited 0" ]; then docker compose logs; exit 1; fi
      - name: Conferir pontos, nomes, login e previsões
        run: |
          set -e
          . ./.env
          total=$(curl -sf "localhost:8080/sensores?size=200" | jq '.page.totalElements')
          echo "Sensores: $total"; [ "$total" = 136 ]
          nome=$(curl -sf "localhost:8080/sensores?size=200" | jq -r '.content[] | select(.codigo == "bueiro_01") | .vizinhanca')
          echo "bueiro_01: $nome"; echo "$nome" | grep -q "Tietê"
          token=$(curl -sf -X POST localhost:8080/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"senha\":\"$ADMIN_SENHA\"}" | jq -r .token)
          [ -n "$token" ] && [ "$token" != null ]
          curl -sf localhost:8080/previsoes > /dev/null
          curl -sf localhost:8080/push/chave-publica > /dev/null
          echo "Compose ok"
      - name: Log se falhou
        if: failure()
        run: docker compose logs --tail 200
      - name: Desligar
        if: always()
        run: docker compose down -v

  ci:
    name: ci
    needs: [mudancas, backend, backend-imagem, ia, ia-imagem, app, site, iot, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Nenhuma parte falhou
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Alguma parte falhou: veja os jobs acima."; exit 1
          fi
