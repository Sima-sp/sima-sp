# Publica a página do projeto e a demonstração do app no GitHub Pages, juntas:
#   https://sima-sp.github.io/sima-sp/       página (pasta site/)
#   https://sima-sp.github.io/sima-sp/app/   app em modo demonstração (pasta app/)
#
# Roda a cada envio para a main que mexe em app/ ou site/, e pelo botão "Run workflow".
# Uma vez só, no repositório: Settings → Pages → Source: "GitHub Actions".

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "site/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios chegarem juntos, vale o mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Gerar a página e o app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6

      - name: App (demonstração)
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build:demo

      - name: Página
        working-directory: site
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_URL_APP: ${{ steps.pages.outputs.base_url }}/app/

      - name: Juntar (página na raiz, app em app/)
        run: |
          mkdir -p publicar
          cp -r site/out/. publicar/
          mkdir -p publicar/app
          cp -r app/dist/. publicar/app/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: publicar

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
